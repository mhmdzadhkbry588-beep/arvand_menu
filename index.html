<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کافه اروند</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a18;--blue:#1c4fd8;--blue2:#0b2a7a;--sky:#8fb3ff;--line:rgba(120,160,255,.16)}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(120% 55% at 50% 0,#0e2a7a 0,var(--bg) 62%) no-repeat,var(--bg);color:#fff;font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7;padding-bottom:90px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.hero{text-align:center;padding:34px 20px 24px}
.logo{width:58px;height:58px;margin:0 auto;border:1.5px solid #3b6bff;border-radius:18px;background:linear-gradient(#123a9e,#06133a);display:grid;place-items:center;font-weight:700;font-size:22px;box-shadow:0 0 30px #1c4fd855}
.hero h1{font-size:30px;margin-top:16px;line-height:1.3}
.en{letter-spacing:7px;color:var(--sky);font-size:11px;direction:ltr;margin-top:2px}
.hero p{margin-top:12px;color:#cfd6ee;font-size:13px}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;color:var(--sky);font-size:11px}
.orn:before,.orn:after{content:"";width:46px;height:1px;background:linear-gradient(to left,transparent,var(--sky))}
.orn:after{transform:scaleX(-1)}
.bar2{position:sticky;top:0;z-index:5;background:rgba(5,10,24,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px;max-width:560px;margin:0 auto;scrollbar-width:none}
.chip{flex:none;border:1px solid rgba(120,160,255,.35);border-radius:20px;padding:6px 14px;background:transparent;color:#cfd6ee;font:inherit;font-size:11px;cursor:pointer}
.chip.on{background:linear-gradient(#1c4fd8,#0a2470);border-color:#3b6bff;color:#fff}
.sr{display:block;width:calc(100% - 32px);max-width:528px;margin:16px auto 0;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;color:#fff;padding:8px 14px;font:inherit;font-size:12px;outline:0}
.sr::placeholder{color:#7f8fc4}
.cat{margin-top:26px;scroll-margin-top:70px}
#list{padding-bottom:35vh}
.cat h3,.ct h3{display:flex;align-items:center;gap:12px;font-size:14px;margin-bottom:10px}
.cat h3:before,.cat h3:after,.ct h3:before,.ct h3:after{content:"";flex:1;height:1px;background:linear-gradient(to left,transparent,rgba(120,160,255,.5))}
.cat h3:after,.ct h3:after{transform:scaleX(-1)}
.list{background:linear-gradient(rgba(28,79,216,.16),rgba(28,79,216,.05));border:1px solid var(--line);border-radius:20px;padding:2px 16px}
.it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}
.ph{flex:none;width:54px;height:54px;border-radius:14px;background:#1a2a5c center/cover;border:1px solid rgba(255,255,255,.18)}
.tx{flex:1;min-width:0}
.nm{display:flex;align-items:baseline;gap:8px;font-weight:600;font-size:13px}
.dt{flex:1;border-bottom:1px dotted rgba(255,255,255,.28);min-width:12px;transform:translateY(-3px)}
.pr{color:var(--sky);font-weight:700;font-size:12px;white-space:nowrap}
.pr small{font-size:9px;font-weight:400;color:#93a3d8}
.ds{font-size:10.5px;color:#93a3d8;line-height:1.55;margin-top:1px}
#fab{position:fixed;left:16px;bottom:16px;border:0;border-radius:30px;padding:16px 26px;background:linear-gradient(#0f2f86,#06133a);color:#fff;font:inherit;display:none;box-shadow:0 6px 20px #0008;z-index:9}
#adm{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:14px;display:none}
#adm.open{display:block}
.bar{position:sticky;top:-14px;background:var(--bg);display:flex;gap:8px;padding:10px 0;flex-wrap:wrap;z-index:2}
.bar button,.add{border:0;border-radius:10px;padding:8px 14px;background:var(--blue);color:#fff;font:inherit;font-size:13px}
.bar .g{background:#333}.bar .r{background:#8a1f2b}
.ac{margin:14px 0 4px;color:#8fb3ff;font-weight:700}
.row{display:grid;grid-template-columns:56px 1fr 90px 34px;gap:6px;align-items:center;background:#0e1a3a;border-radius:12px;padding:8px;margin-bottom:8px}
.row .th{width:56px;height:56px;border-radius:10px;background:#d6d3cb center/cover;border:0;color:#666;font-size:12px;grid-row:span 2}
.row input{width:100%;background:#fff;color:#000;border:0;border-radius:8px;padding:7px 9px;font:inherit;font-size:13px}
.row .d{grid-column:2/4}
.row .x{background:#8a1f2b;color:#fff;border:0;border-radius:8px;height:34px;grid-row:span 2}
.hint{font-size:12px;color:#aab4d8}

.ct{max-width:560px;margin:34px auto 0;padding:0 16px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cb2{display:block;text-decoration:none;color:#fff;background:rgba(28,79,216,.18);border:1px solid rgba(120,160,255,.35);border-radius:16px;padding:12px 14px;font-size:11px;text-align:center}
.cb2:first-child{grid-column:1/-1;background:linear-gradient(#1c4fd8,#0a2470);border-color:#3b6bff}
.cb2 b{display:block;font-size:12.5px}
.cb2 span{color:#b4c1ee;display:block;direction:ltr}
.cb2.w{grid-column:1/-1}
.cb2.w span{direction:rtl}
.ac{display:flex;gap:6px;align-items:center}.ac input{flex:1;min-width:0;background:#fff;color:#000;border:0;border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;font-weight:700}.ac button{border:0;border-radius:8px;background:var(--blue);color:#fff;padding:7px 10px;font:inherit;font-size:12px}.ac .x{background:#8a1f2b}

const K='arvand_menu_v1';
let S,act='all';
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parse(t){const o=[];t.split('\n').forEach(l=>{l=l.trim();if(!l)return;if(l[0]=='#'){const[a,b]=l.slice(1).split('|');o.push({id:a,title:b,items:[]})}else{const[n,d]=l.split(';');o[o.length-1].items.push({n:n,d:d||'',p:'',i:''})}});return o}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('حافظه مرورگر پر شد؛ عکس‌ها را کوچک‌تر کنید یا خروجی بگیرید.')}}
const nz=t=>String(t||'').replace(/ي/g,'ی').replace(/ك/g,'ک');
let q='';
function card(x){return `<div class="it">${x.i?`<div class="ph" style="background-image:url('${esc(x.i)}')"></div>`:''}<div class="tx"><div class="nm"><span>${esc(x.n)}</span>${x.p?`<i class="dt"></i><b class="pr">${esc(x.p)} <small>تومان</small></b>`:''}</div>${x.d?`<div class="ds">${esc(x.d)}</div>`:''}</div></div>`}
function view(){
  $('#chips').innerHTML=[{id:'all',title:'همه'}].concat(S.filter(c=>c.items.length)).map(c=>`<button class="chip ${c.id==act?'on':''}" data-id="${esc(c.id)}">${esc(c.title)}</button>`).join('');
  const f=c=>c.items.filter(x=>!q||nz(x.n+' '+x.d).includes(q));
  const h=S.map(c=>[c,f(c)]).filter(o=>o[1].length).map(o=>`<div class="cat" data-sec="${esc(o[0].id)}"><h3>${esc(o[0].title)}</h3><div class="list">${o[1].map(card).join('')}</div></div>`).join('');
  $('#list').innerHTML=h||'<p style="text-align:center;color:#7f8fc4;margin-top:30px;font-size:12px">موردی پیدا نشد</p>';
}
$('#q').addEventListener('input',e=>{q=nz(e.target.value.trim());view()});
function mark(){document.querySelectorAll('#chips .chip').forEach(b=>{const on=b.dataset.id==act;b.classList.toggle('on',on);if(on)b.scrollIntoView({inline:'center',block:'nearest'})})}
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;act=b.dataset.id;mark();
  if(act=='all'){scrollTo({top:Math.max(0,$('#q').offsetTop-60),behavior:'smooth'});return}
  const el=[...document.querySelectorAll('.cat')].find(c=>c.dataset.sec==act);
  if(el)scrollTo({top:el.getBoundingClientRect().top+scrollY-70,behavior:'smooth'})};
addEventListener('scroll',()=>{let cur='all';document.querySelectorAll('.cat').forEach(c=>{if(c.getBoundingClientRect().top<=100)cur=c.dataset.sec});
  if(innerHeight+scrollY>=document.body.scrollHeight-4){const a=document.querySelectorAll('.cat');if(a.length)cur=a[a.length-1].dataset.sec}
  if(cur!=act){act=cur;mark()}},{passive:true});

function adm(){
  $('#adm').innerHTML=`<div class="bar"><button id="cl">بستن</button><button id="pb" style="background:#1a8f4b">انتشار برای مشتریان</button><button id="nc">+ دسته جدید</button><button class="g" id="ex">دانلود menu.json</button><button class="g" id="im">وارد کردن menu.json</button><button class="g" id="tk">توکن</button><button class="r" id="rs">بازنشانی</button></div>
  <p class="hint">تغییرات روی همین گوشی ذخیره می‌شود. برای اینکه مشتری‌ها هم ببینند، «انتشار برای مشتریان» را بزنید.</p>`+
  S.map((c,ci)=>`<div class="ac" data-ci="${ci}"><input data-ck="1" value="${esc(c.title)}" placeholder="نام دسته"><button data-a="cup">↑</button><button data-a="cdn">↓</button><button class="x" data-a="cdel">حذف دسته</button></div>`+c.items.map((x,xi)=>`<div class="row" data-c="${ci}" data-x="${xi}"><button class="th" data-a="img" ${x.i?`style="background-image:url('${esc(x.i)}')"`:''}>${x.i?'':'عکس'}</button><input data-k="n" value="${esc(x.n)}" placeholder="نام"><input data-k="p" value="${esc(x.p)}" placeholder="قیمت" inputmode="numeric"><button class="x" data-a="del">×</button><input class="d" data-k="d" value="${esc(x.d)}" placeholder="توضیح"></div>`).join('')+`<button class="add" data-a="add" data-c="${ci}">+ افزودن محصول</button>`).join('')+`<input type="file" id="f" accept="image/*" hidden><input type="file" id="jf" accept=".json" hidden>`;
}
let pick;
$('#adm').addEventListener('input',e=>{if(e.target.dataset.ck){const a=e.target.closest('.ac');S[a.dataset.ci].title=e.target.value;save();view();return}const r=e.target.closest('.row'),k=e.target.dataset.k;if(r&&k){S[r.dataset.c].items[r.dataset.x][k]=e.target.value;save();view()}});
$('#adm').addEventListener('click',e=>{
  const t=e.target,id=t.id,a=t.dataset.a,r=t.closest('.row');
  if(id=='cl'){$('#adm').classList.remove('open');view()}
  if(id=='ex'){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='menu.json';l.click()}
  if(id=='im')$('#jf').click();
  if(id=='pb')publish(t);
  if(id=='tk'){const v=prompt('توکن جدید را بچسبانید (خالی = حذف توکن)');if(v!==null){v.trim()?localStorage.setItem('arvand_tok',v.trim()):localStorage.removeItem('arvand_tok')}}
  if(id=='nc'){S.push({id:'c'+Date.now(),title:'دسته جدید',items:[]});save();adm();view();scrollTo(0,document.body.scrollHeight)}
  const ac=t.closest('.ac');
  if(ac&&a){const i=+ac.dataset.ci;
    if(a=='cup'&&i>0){[S[i-1],S[i]]=[S[i],S[i-1]];save();adm();view()}
    if(a=='cdn'&&i<S.length-1){[S[i+1],S[i]]=[S[i],S[i+1]];save();adm();view()}
    if(a=='cdel'&&confirm('این دسته و همه محصولاتش حذف شود؟')){if(act==S[i].id)act='all';S.splice(i,1);save();adm();view()}}
  if(id=='rs'&&confirm('همه تغییرات این دستگاه پاک شود؟')){localStorage.removeItem(K);S=parse(RAW);adm();view()}
  if(a=='img'){pick=r;$('#f').click()}
  if(a=='del'&&confirm('این محصول حذف شود؟')){S[r.dataset.c].items.splice(r.dataset.x,1);save();adm()}
  if(a=='add'){S[t.dataset.c].items.push({n:'محصول جدید',d:'',p:'',i:''});save();adm()}
});
$('#adm').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  if(e.target.id=='jf'){const rd=new FileReader();rd.onload=()=>{try{S=JSON.parse(rd.result);save();adm();view()}catch(x){alert('فایل معتبر نیست')}};rd.readAsText(f)}
  if(e.target.id=='f'&&pick){const im=new Image(),c=pick;im.onload=()=>{const w=520,s=Math.min(1,w/im.width),cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);S[c.dataset.c].items[c.dataset.x].i=cv.toDataURL('image/jpeg',.72);save();adm();view()};im.src=URL.createObjectURL(f)}
  e.target.value='';
});

const GH={repo:'mhmdzadhkbry588-beep/arvand_menu',br:'main'};
function gh(path,method,body){return fetch('https://api.github.com/repos/'+GH.repo+'/contents/'+path+(method=='GET'?'?ref='+GH.br:''),{method:method,headers:{Authorization:'Bearer '+localStorage.getItem('arvand_tok'),Accept:'application/vnd.github+json'},body:body?JSON.stringify(body):undefined})}
async function put(path,b64,msg){
  const g=await gh(path,'GET');let sha;
  if(g.status==200)sha=(await g.json()).sha;else if(g.status!=404)throw new Error(g.status);
  const b={message:msg,content:b64,branch:GH.br};if(sha)b.sha=sha;
  const r=await gh(path,'PUT',b);if(!r.ok)throw new Error(r.status);
}
async function publish(btn){
  if(!localStorage.getItem('arvand_tok')){const t=prompt('توکن GitHub را بچسبانید');if(!t)return;localStorage.setItem('arvand_tok',t.trim())}
  const old=btn.textContent;btn.disabled=true;
  try{
    const P=JSON.parse(JSON.stringify(S));let n=0;
    for(let ci=0;ci<S.length;ci++)for(let xi=0;xi<S[ci].items.length;xi++){
      const x=S[ci].items[xi],y=P[ci].items[xi];
      if(x.i&&x.i.indexOf('data:')==0){
        if(!(x.u&&x.k===x.i.length)){
          btn.textContent='آپلود عکس '+(++n)+'...';
          const path='img/p'+Date.now()+Math.random().toString(36).slice(2,6)+'.jpg';
          await put(path,x.i.split(',')[1],'photo');x.u=path;x.k=x.i.length;
        }
        y.i=x.u;
      }
      delete y.u;delete y.k;
    }
    btn.textContent='در حال انتشار...';
    await put('menu.json',btoa(unescape(encodeURIComponent(JSON.stringify(P)))),'update menu');
    save();
    alert('منتشر شد. تا یکی دو دقیقه دیگر مشتری‌ها تغییرات را می‌بینند.');
  }catch(e){
    const c=String(e.message);
    if(c=='401'||c=='403'||c=='404'){localStorage.removeItem('arvand_tok');alert('توکن درست نیست یا اجازه ندارد. دوباره دکمه را بزنید و توکن جدید بدهید.')}
    else alert('انتشار نشد؛ اینترنت یا فیلترشکن را بررسی کنید.');
  }
  btn.disabled=false;btn.textContent=old;
}

addEventListener('hashchange',gate);

(async()=>{
  try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
  if(!S){try{const r=await fetch('menu.json',{cache:'no-store'});if(r.ok)S=await r.json()}catch(e){}}

})();
