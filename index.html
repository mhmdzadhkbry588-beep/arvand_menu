<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>کافه اروند | منوی دیجیتال</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a18;--blue:#1c4fd8;--blue2:#0b2a7a;--card:#ebe8e1;--ink:#14161c;--mute:#8a8c94}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:#fff;font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7;padding-bottom:90px}
.hero{background:linear-gradient(160deg,#050a18 35%,var(--blue) 140%);padding:26px 22px 40px;min-height:300px;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;direction:ltr}
.logo{width:46px;height:46px;border:1.5px solid var(--blue);border-radius:14px;background:linear-gradient(#123a9e,#06133a);display:grid;place-items:center;font-weight:700}
.top small{letter-spacing:3px;font-size:11px;color:#cfd6ee}
.hero h1{font-size:40px;margin-top:46px;line-height:1.3}
.en{letter-spacing:6px;color:#6fa4ff;font-size:14px;direction:ltr;text-align:right}
.hero p{margin-top:16px;color:#dfe5f7}
.tag{display:flex;align-items:center;gap:10px;margin-top:28px;color:#8fb3ff;font-size:14px}
.tag:after{content:"";width:50px;height:2px;background:#4a86ff}
.menu{background:linear-gradient(#071433,var(--bg) 220px);padding:26px 18px 0}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mh h2{font-size:22px}
.mh p{color:#cfd6ee;font-size:14px}
.pill{flex:none;background:#e9e9ef;color:#5b6aa8;border-radius:24px;padding:6px 16px;font-size:12px;letter-spacing:1px;direction:ltr}
.chips{display:flex;gap:10px;overflow-x:auto;margin:20px -18px;padding:4px 18px;scrollbar-width:none}
.chip{flex:none;border:0;border-radius:24px;padding:8px 15px;background:#e9e9ef;color:#2a2d38;font:inherit;font-size:11px;cursor:pointer}
.chip.on{background:linear-gradient(#123a9e,#0a2470);color:#fff}
.cat h3{font-size:13px;margin:22px 0 14px;padding-bottom:8px;border-bottom:2px solid;border-image:linear-gradient(to left,transparent 40%,var(--blue)) 1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--card);color:var(--ink);border-radius:22px;overflow:hidden}
.im{aspect-ratio:4/3;background:#d6d3cb center/cover;display:grid;place-items:center;color:#9a9890;font-size:34px}
.cb{padding:8px 10px 10px;background:var(--card)}
.cn{font-weight:700;font-size:11px}
.cd{font-size:9px;color:var(--mute);line-height:1.5;margin-top:2px}
.cp{font-size:9.5px;color:var(--mute);margin-top:5px}
.cp.s{color:var(--blue);font-weight:700}
#fab{position:fixed;left:16px;bottom:16px;border:0;border-radius:30px;padding:16px 26px;background:linear-gradient(#0f2f86,#06133a);color:#fff;font:inherit;display:none;box-shadow:0 6px 20px #0008;z-index:9}
#adm{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:14px;display:none}
#adm.open{display:block}
.bar{position:sticky;top:-14px;background:var(--bg);display:flex;gap:8px;padding:10px 0;flex-wrap:wrap;z-index:2}
.bar button,.add{border:0;border-radius:10px;padding:8px 14px;background:var(--blue);color:#fff;font:inherit;font-size:13px}
.bar .g{background:#333}.bar .r{background:#8a1f2b}
.ac{margin:14px 0 4px;color:#8fb3ff;font-weight:700}
.row{display:grid;grid-template-columns:56px 1fr 90px 34px;gap:6px;align-items:center;background:#0e1a3a;border-radius:12px;padding:8px;margin-bottom:8px}
.row .th{width:56px;height:56px;border-radius:10px;background:#d6d3cb center/cover;border:0;color:#666;font-size:12px;grid-row:span 2}
.row input{width:100%;background:#fff;color:#000;border:0;border-radius:8px;padding:7px 9px;font:inherit;font-size:13px}
.row .d{grid-column:2/4}
.row .x{background:#8a1f2b;color:#fff;border:0;border-radius:8px;height:34px;grid-row:span 2}
.hint{font-size:12px;color:#aab4d8}

.ct{max-width:720px;margin:26px auto 0;padding:0 18px}
.ct h3{font-size:14px;margin-bottom:12px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cb2{display:block;text-decoration:none;color:#fff;background:linear-gradient(#123a9e,#0a2470);border-radius:16px;padding:12px 14px;font-size:12px}
.cb2 b{display:block;font-size:13px}
.cb2 span{color:#cfd6ee;direction:ltr;display:block;text-align:right}
.cb2.w{grid-column:1/-1;background:#ebe8e1;color:#14161c}
.cb2.w span{color:#6a6c74;direction:rtl}
.ac{display:flex;gap:6px;align-items:center}.ac input{flex:1;min-width:0;background:#fff;color:#000;border:0;border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;font-weight:700}.ac button{border:0;border-radius:8px;background:var(--blue);color:#fff;padding:7px 10px;font:inherit;font-size:12px}.ac .x{background:#8a1f2b}
</style>
</head>
<body>
<section class="hero">
  <div class="top"><div class="logo">A</div><small>COFFEE · FOOD · MOMENTS</small></div>
  <h1>کافه اروند</h1>
  <div class="en">ARVAND CAFE</div>
  <p>یک مکث خوش‌طعم، میان شلوغی روز</p>
  <div class="tag">منوی دیجیتال کافه</div>
</section>
<section class="menu">
  <div class="mh"><div><h2>منوی ما</h2><p>انتخابت رو پیدا کن و از لحظه‌ات لذت ببر.</p></div><span class="pill">MADE WITH CARE</span></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</section>
<section class="ct"><h3>ارتباط با ما</h3><div class="cg" id="ct"></div></section>
<p style="text-align:center;color:#6f7aa8;font-size:10px;margin-top:22px">نسخه ۴</p>
<button id="fab">مدیریت منو</button>
<div id="adm"></div>

<script>

const K='arvand_menu_v1';
let S,act='all';
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parse(t){const o=[];t.split('\n').forEach(l=>{l=l.trim();if(!l)return;if(l[0]=='#'){const[a,b]=l.slice(1).split('|');o.push({id:a,title:b,items:[]})}else{const[n,d]=l.split(';');o[o.length-1].items.push({n:n,d:d||'',p:'',i:''})}});return o}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('حافظه مرورگر پر شد؛ عکس‌ها را کوچک‌تر کنید یا خروجی بگیرید.')}}
function card(x){return `<div class="card"><div class="im" ${x.i?`style="background-image:url('${esc(x.i)}')"`:''}>${x.i?'':'✳'}</div><div class="cb"><div class="cn">${esc(x.n)}</div>${x.d?`<div class="cd">${esc(x.d)}</div>`:''}<div class="cp ${x.p?'s':''}">${x.p?esc(x.p)+' تومان':'قیمت اعلام می‌شود'}</div></div></div>`}
function view(){
  $('#chips').innerHTML=[{id:'all',title:'همه'}].concat(S.filter(c=>c.items.length)).map(c=>`<button class="chip ${c.id==act?'on':''}" data-id="${esc(c.id)}">${esc(c.title)}</button>`).join('');
  $('#list').innerHTML=S.filter(c=>act=='all'||c.id==act).filter(c=>c.items.length).map(c=>`<div class="cat"><h3>${esc(c.title)}</h3><div class="grid">${c.items.map(card).join('')}</div></div>`).join('');
}
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(b){act=b.dataset.id;view()}};

function adm(){
  $('#adm').innerHTML=`<div class="bar"><button id="cl">بستن</button><button id="nc">+ دسته جدید</button><button class="g" id="ex">دانلود menu.json</button><button class="g" id="im">وارد کردن menu.json</button><button class="r" id="rs">بازنشانی</button></div>
  <p class="hint">تغییرات روی همین دستگاه ذخیره می‌شود. برای دیده شدن توسط مشتری‌ها «دانلود menu.json» را بزنید و آن فایل را در GitHub کنار index.html آپلود کنید.</p>`+
  S.map((c,ci)=>`<div class="ac" data-ci="${ci}"><input data-ck="1" value="${esc(c.title)}" placeholder="نام دسته"><button data-a="cup">↑</button><button data-a="cdn">↓</button><button class="x" data-a="cdel">حذف دسته</button></div>`+c.items.map((x,xi)=>`<div class="row" data-c="${ci}" data-x="${xi}"><button class="th" data-a="img" ${x.i?`style="background-image:url('${esc(x.i)}')"`:''}>${x.i?'':'عکس'}</button><input data-k="n" value="${esc(x.n)}" placeholder="نام"><input data-k="p" value="${esc(x.p)}" placeholder="قیمت" inputmode="numeric"><button class="x" data-a="del">×</button><input class="d" data-k="d" value="${esc(x.d)}" placeholder="توضیح"></div>`).join('')+`<button class="add" data-a="add" data-c="${ci}">+ افزودن محصول</button>`).join('')+`<input type="file" id="f" accept="image/*" hidden><input type="file" id="jf" accept=".json" hidden>`;
}
let pick;
$('#adm').addEventListener('input',e=>{if(e.target.dataset.ck){const a=e.target.closest('.ac');S[a.dataset.ci].title=e.target.value;save();view();return}const r=e.target.closest('.row'),k=e.target.dataset.k;if(r&&k){S[r.dataset.c].items[r.dataset.x][k]=e.target.value;save();view()}});
$('#adm').addEventListener('click',e=>{
  const t=e.target,id=t.id,a=t.dataset.a,r=t.closest('.row');
  if(id=='cl'){$('#adm').classList.remove('open');view()}
  if(id=='ex'){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='menu.json';l.click()}
  if(id=='im')$('#jf').click();
  if(id=='nc'){S.push({id:'c'+Date.now(),title:'دسته جدید',items:[]});save();adm();view();scrollTo(0,document.body.scrollHeight)}
  const ac=t.closest('.ac');
  if(ac&&a){const i=+ac.dataset.ci;
    if(a=='cup'&&i>0){[S[i-1],S[i]]=[S[i],S[i-1]];save();adm();view()}
    if(a=='cdn'&&i<S.length-1){[S[i+1],S[i]]=[S[i],S[i+1]];save();adm();view()}
    if(a=='cdel'&&confirm('این دسته و همه محصولاتش حذف شود؟')){if(act==S[i].id)act='all';S.splice(i,1);save();adm();view()}}
  if(id=='rs'&&confirm('همه تغییرات این دستگاه پاک شود؟')){localStorage.removeItem(K);S=parse(RAW);adm();view()}
  if(a=='img'){pick=r;$('#f').click()}
  if(a=='del'&&confirm('این محصول حذف شود؟')){S[r.dataset.c].items.splice(r.dataset.x,1);save();adm()}
  if(a=='add'){S[t.dataset.c].items.push({n:'محصول جدید',d:'',p:'',i:''});save();adm()}
});
$('#adm').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  if(e.target.id=='jf'){const rd=new FileReader();rd.onload=()=>{try{S=JSON.parse(rd.result);save();adm();view()}catch(x){alert('فایل معتبر نیست')}};rd.readAsText(f)}
  if(e.target.id=='f'&&pick){const im=new Image(),c=pick;im.onload=()=>{const w=520,s=Math.min(1,w/im.width),cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);S[c.dataset.c].items[c.dataset.x].i=cv.toDataURL('image/jpeg',.72);save();adm();view()};im.src=URL.createObjectURL(f)}
  e.target.value='';
});
$('#fab').onclick=()=>{adm();$('#adm').classList.add('open')};
function gate(){$('#fab').style.display=location.hash=='#admin'?'block':'none'}
addEventListener('hashchange',gate);

(async()=>{
  try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
  if(!S){try{const r=await fetch('menu.json',{cache:'no-store'});if(r.ok)S=await r.json()}catch(e){}}
  if(!S)S=parse(RAW);
  view();gate();
})();

/* ===== اطلاعات تماس (اینجا را ویرایش کنید) ===== */
const CFG={
 phone:"09036375487",        /* شماره رزرو و عضویت */

 insta:"cafe_arvand",        /* اسم صفحه اینستاگرام */

};
(function(){
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
  const sms='sms:'+CFG.phone+(ios?'&':'?')+'body='+encodeURIComponent(CFG.clubText);
  let h=`<a class="cb2" href="tel:${CFG.phone}"><b>رزرو میز</b><span>${CFG.phoneShow}</span></a>`+
  `<a class="cb2" href="https://instagram.com/${CFG.insta}"><b>اینستاگرام</b><span>@${CFG.insta}</span></a>`+
  `<a class="cb2" href="${sms}"><b>باشگاه مشتریان</b><span style="direction:rtl">ثبت شماره با پیامک</span></a>`;
  if(CFG.addr)h+=`<${CFG.map?'a href="'+esc(CFG.map)+'"':'div'} class="cb2 w"><b>آدرس</b><span>${esc(CFG.addr)}${CFG.map?' · مسیریابی':''}</span></${CFG.map?'a':'div'}>`;
  document.getElementById('ct').innerHTML=h;
})();
</script>
